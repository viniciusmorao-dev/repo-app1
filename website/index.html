<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Deploy DevOps</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <div class="background"></div>

  <header class="header">
    <h1>Deploy Automatizado</h1>
    <p>Pipeline CI/CD com Docker e GitHub Actions</p>
  </header>

  <main class="container">
    <div class="card">
      <div class="status">
        <span class="dot"></span>
        <span>Deploy concluído</span>
      </div>

      <h2>Aplicação está no ar</h2>

      <p>
        A imagem Docker foi buildada e enviada com sucesso.
        Sua pipeline está funcionando corretamente.
      </p>

      <button onclick="handleClick()">Verificar pipeline</button>
    </div>
  </main>

  <script>
    function handleClick() {
      alert("Tudo certo! Pipeline rodando liso.");
    }
  </script>

</body>
</html>
